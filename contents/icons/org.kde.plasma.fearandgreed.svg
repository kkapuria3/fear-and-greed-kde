<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Physical Board Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#0f1116"/>
    </linearGradient>

    <!-- Display Board Inner Area Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- LED Dot Matrix Grid Texture -->
    <pattern id="dotGrid" width="2" height="2" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.32" fill="#14171d"/>
    </pattern>

    <!-- Orange/Amber LED Dot Template for FEAR Readout -->
    <g id="oDot">
      <circle cx="0" cy="0" r="0.9" fill="#ff7b1a"/>
      <circle cx="0" cy="0" r="0.45" fill="#fff0e0"/>
    </g>

    <!-- Rounded Clip for 5-Segment Bar -->
    <clipPath id="barClip">
      <rect x="0" y="0" width="48" height="14" rx="2.2" ry="2.2"/>
    </clipPath>
  </defs>

  <!-- 1. Physical Electronic Board Outer Bezel -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bezelGrad)" stroke="#383e4a" stroke-width="1.8"/>

  <!-- 2. Screen Surface (inset: x=5 to 59, y=5 to 59) -->
  <rect x="5" y="5" width="54" height="54" rx="8" ry="8" fill="url(#screenGrad)"/>

  <!-- 3. LED Matrix Texture -->
  <rect x="5" y="5" width="54" height="54" rx="8" ry="8" fill="url(#dotGrid)"/>

  <!-- 4. Subtle Top Glass Highlight -->
  <path d="M 6 14 C 6 8.5 9.5 6 15 6 L 49 6 C 54.5 6 58 8.5 58 14 L 58 16 L 6 16 Z" fill="#ffffff" fill-opacity="0.04"/>

  <!-- ========================================================================= -->
  <!-- ROW 1: TOP HEADER                                                         -->
  <!-- ========================================================================= -->
  <text x="32" y="14.5"
        fill="#e2e8f0"
        font-family="'SF Mono', 'DejaVu Sans Mono', 'Courier New', monospace"
        font-size="5.3"
        font-weight="bold"
        text-anchor="middle"
        letter-spacing="0.35">FEAR &amp; GREED</text>

  <!-- ========================================================================= -->
  <!-- ROW 2: 5-SEGMENT COLOR INDICATOR BAR + WHITE POSITION MARKER              -->
  <!-- ========================================================================= -->
  <g transform="translate(8, 21)">
    <!-- 5 Colored Segments inside rounded clip -->
    <g clip-path="url(#barClip)">
      <rect x="0"    y="0" width="9.6" height="14" fill="#d62828"/>
      <rect x="9.6"  y="0" width="9.6" height="14" fill="#f47920"/>
      <rect x="19.2" y="0" width="9.6" height="14" fill="#eab311"/>
      <rect x="28.8" y="0" width="9.6" height="14" fill="#22c55e"/>
      <rect x="38.4" y="0" width="9.6" height="14" fill="#15803d"/>
      <!-- Top glossy sheen on bar -->
      <rect x="0" y="0" width="48" height="5" fill="#ffffff" fill-opacity="0.12"/>
    </g>

    <!-- Subtle Bar Border -->
    <rect x="0" y="0" width="48" height="14" rx="2.2" ry="2.2" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.6"/>

    <!-- White Vertical Marker Line at Score 28 (Fear segment) -->
    <rect x="12.2" y="-3" width="4.4" height="20" rx="2.2" fill="#000000" fill-opacity="0.65"/>
    <rect x="13.1" y="-2.2" width="2.6" height="18.4" rx="1.3" fill="#ffffff"/>
  </g>

  <!-- ========================================================================= -->
  <!-- ROW 3: LED DOT-MATRIX READOUT "28 FEAR" (y: 42.5 to 51.5)                 -->
  <!-- ========================================================================= -->
  <!-- '2' (x: 9 to 13.5) -->
  <use href="#oDot" x="9" y="42.5"/><use href="#oDot" x="11.2" y="42.5"/><use href="#oDot" x="13.5" y="42.5"/>
  <use href="#oDot" x="13.5" y="44.7"/>
  <use href="#oDot" x="9" y="47.0"/><use href="#oDot" x="11.2" y="47.0"/><use href="#oDot" x="13.5" y="47.0"/>
  <use href="#oDot" x="9" y="49.3"/>
  <use href="#oDot" x="9" y="51.5"/><use href="#oDot" x="11.2" y="51.5"/><use href="#oDot" x="13.5" y="51.5"/>

  <!-- '8' (x: 16 to 20.5) -->
  <use href="#oDot" x="16" y="42.5"/><use href="#oDot" x="18.2" y="42.5"/><use href="#oDot" x="20.5" y="42.5"/>
  <use href="#oDot" x="16" y="44.7"/><use href="#oDot" x="20.5" y="44.7"/>
  <use href="#oDot" x="16" y="47.0"/><use href="#oDot" x="18.2" y="47.0"/><use href="#oDot" x="20.5" y="47.0"/>
  <use href="#oDot" x="16" y="49.3"/><use href="#oDot" x="20.5" y="49.3"/>
  <use href="#oDot" x="16" y="51.5"/><use href="#oDot" x="18.2" y="51.5"/><use href="#oDot" x="20.5" y="51.5"/>

  <!-- 'F' (x: 26 to 30) -->
  <use href="#oDot" x="26" y="42.5"/><use href="#oDot" x="28" y="42.5"/><use href="#oDot" x="30" y="42.5"/>
  <use href="#oDot" x="26" y="44.7"/>
  <use href="#oDot" x="26" y="47.0"/><use href="#oDot" x="28" y="47.0"/><use href="#oDot" x="30" y="47.0"/>
  <use href="#oDot" x="26" y="49.3"/>
  <use href="#oDot" x="26" y="51.5"/>

  <!-- 'E' (x: 32.5 to 36.5) -->
  <use href="#oDot" x="32.5" y="42.5"/><use href="#oDot" x="34.5" y="42.5"/><use href="#oDot" x="36.5" y="42.5"/>
  <use href="#oDot" x="32.5" y="44.7"/>
  <use href="#oDot" x="32.5" y="47.0"/><use href="#oDot" x="34.5" y="47.0"/><use href="#oDot" x="36.5" y="47.0"/>
  <use href="#oDot" x="32.5" y="49.3"/>
  <use href="#oDot" x="32.5" y="51.5"/><use href="#oDot" x="34.5" y="51.5"/><use href="#oDot" x="36.5" y="51.5"/>

  <!-- 'A' (x: 39 to 43.5) -->
  <use href="#oDot" x="41.2" y="42.5"/>
  <use href="#oDot" x="39.8" y="44.7"/><use href="#oDot" x="42.7" y="44.7"/>
  <use href="#oDot" x="39" y="47.0"/><use href="#oDot" x="41.2" y="47.0"/><use href="#oDot" x="43.5" y="47.0"/>
  <use href="#oDot" x="39" y="49.3"/><use href="#oDot" x="43.5" y="49.3"/>
  <use href="#oDot" x="39" y="51.5"/><use href="#oDot" x="43.5" y="51.5"/>

  <!-- 'R' (x: 46 to 50.5) -->
  <use href="#oDot" x="46" y="42.5"/><use href="#oDot" x="48.2" y="42.5"/><use href="#oDot" x="50.2" y="42.5"/>
  <use href="#oDot" x="46" y="44.7"/><use href="#oDot" x="50.5" y="44.7"/>
  <use href="#oDot" x="46" y="47.0"/><use href="#oDot" x="48.2" y="47.0"/><use href="#oDot" x="50.2" y="47.0"/>
  <use href="#oDot" x="46" y="49.3"/><use href="#oDot" x="49" y="49.3"/>
  <use href="#oDot" x="46" y="51.5"/><use href="#oDot" x="50.5" y="51.5"/>

</svg>
